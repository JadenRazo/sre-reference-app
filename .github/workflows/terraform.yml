# Static checks for infra/. Runs on every PR touching the IaC and on every
# push to main. No AWS credentials are used or required: terraform init runs
# with -backend=false (skips S3/local state) and validate is purely static.
#
# Tools, in order of breadth:
#   1. terraform fmt -check     formatting
#   2. terraform validate       syntax + types + provider/module wiring
#   3. tflint                   provider-specific lint (deprecated args, etc.)
#   4. checkov                  security misconfig (encryption, IAM wildcards,
#                               public buckets, missing logging, etc.)
#
# The deploy.yml workflow remains the only path that assumes the OIDC role.

name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: v0.64.0

      - name: tflint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: tflint
        run: tflint --recursive --format=compact

      - name: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          # Every accepted lab exception has a control-by-control rationale and
          # production requirement in docs/security-baseline.md.
          skip_check: CKV_AWS_2,CKV_AWS_91,CKV_AWS_103,CKV_AWS_136,CKV_AWS_150,CKV_AWS_158,CKV_AWS_260,CKV_AWS_378,CKV2_AWS_11,CKV2_AWS_20,CKV2_AWS_28
